name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub to mint an OIDC token. Without id-token: write the
# role assumption below fails. contents: read is the least checkout needs.
# The role's trust policy must allow both subjects this workflow produces:
# repo:<owner>/<repo>:ref:refs/heads/main for pushes and
# repo:<owner>/<repo>:pull_request for PR plans.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-assignment

# One run at a time, across all refs, because every run mutates the same AWS
# resources. A per-ref group would let a PR run and a main run overlap.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Needs no AWS credentials, so it runs on every push and PR regardless of
  # whether the account bootstrap exists.
  validate:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.bootstrap.outputs.deployable }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.1

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform validate

      # The CI role and OIDC provider are one-time account bootstrap this
      # configuration deliberately does not create (see evidence/09). Until
      # that bootstrap exists and its role ARN is set as a repository secret,
      # the deploy job below skips cleanly instead of failing every run.
      # A job-level `if` cannot read the secrets context, hence this hop
      # through an output.
      - name: Check for the deploy role
        id: bootstrap
        run: echo "deployable=${{ secrets.AWS_ROLE_ARN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    if: needs.validate.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.1

      # NOTE: no remote state backend is configured, so state is local to this
      # runner and the workflow can only succeed against a fresh account once.
      # Fine for an exercise that was driven from one laptop; the first change
      # before running this for real is an S3 backend with use_lockfile.
      # See SUBMISSION.md, pipeline section.
      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      # The ECR repository has to exist before an image can be pushed to it,
      # and the image has to exist before the ECS service can reference it.
      # Creating the repository on its own breaks that cycle.
      - name: Create the ECR repository if it does not exist
        if: github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -target=aws_ecr_repository.app

      - name: Log in to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --platform linux/amd64 -t "$IMAGE" ./app
          docker push "$IMAGE"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -var="image_tag=$GITHUB_SHA" -out=tfplan

      # Pull requests stop at the plan above. Everything that changes the
      # account, including the ECR bootstrap and the image push, is gated to
      # pushes on main.
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -input=false -no-color tfplan
